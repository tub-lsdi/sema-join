services:
  mysql:
    image: mysql:latest
    container_name: sema-join-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${APP_DB_DATABASE}
      MYSQL_USER: ${APP_DB_USERNAME}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${APP_DB_ROOT_PASSWORD}
    ports:
      - "${APP_DB_PORT}:3306"
    volumes:
      - mysql_volume:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${APP_DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sema-join-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - duckdb_data:/app/data
      - ${INPUT_DIR}:/app/input:ro
    environment:
      - APP_DB_HOST=mysql
      - APP_DB_PORT=${APP_DB_PORT}
      - APP_DB_DATABASE=${APP_DB_DATABASE}
      - APP_DB_USERNAME=${APP_DB_USERNAME}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      - OLLAMA_BASE_URL=http://ollama:11434
      - INPUT_DIR=/app/input
      - DB_PATH=/app/data/corpus.db
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-10GB}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sema-join-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: sema-join-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  mysql_volume:
  duckdb_data:
  ollama_models:
