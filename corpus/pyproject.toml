[project]
name = "sema-join-corpus"
version = "0.1.0"
description = "Corpus ingestion scripts for SEMA-JOIN"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.3",
    "polars>=1.16.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tqdm>=4.66.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyarrow>=10.0.0",
    "orjson>=3.9.0",
    "regex>=2023.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config.py", "utils", "setup_db"]

[tool.uv]
dev-dependencies = []
