[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sema-join"
version = "0.1.0"
description = "Semantic table joins using PMI scores"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.1",
    "loguru>=0.7.3",
    "orjson>=3.11.4",
    "polars>=1.34.0",
    "pyarrow>=21.0.0",
    "regex>=2025.10.23",
    "requests>=2.31.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pulp>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
